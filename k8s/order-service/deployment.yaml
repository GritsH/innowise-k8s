apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: innowise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      hostAliases:
        - ip: "192.168.65.254"
          hostnames:
            - "keycloak.local"

      containers:
        - name: order-service
          image: order-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8083

          env:
            - name: SERVER_PORT
              value: "8083"

            - name: SPRING_PROFILES_ACTIVE
              value: "docker"

            - name: DB_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: ORDER_DB_URL

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: ORDER_DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: ORDER_DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: ORDER_DB_PASSWORD

          envFrom:
            - configMapRef:
                name: application-config

            - secretRef:
                name: application-secrets

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5